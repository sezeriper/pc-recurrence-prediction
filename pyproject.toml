[project]
name = "pc-recurrence-prediction"
version = "0.1.0"
description = "Curated pancreatic CT embedding and recurrence classification"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  "torch>=2.6,<3",
  "typer>=0.15,<1",
]

[project.scripts]
pc-image-data = "pc_recurrence.image_data.cli:app"
pc-image-embed = "pc_recurrence.image_embedding.cli:app"
pc-recurrence-classify = "pc_recurrence.recurrence_classifier.cli:app"

[project.optional-dependencies]
imaging = [
  "einops>=0.7,<1",
  "matplotlib>=3.10,<4",
  "monai==1.5.1",
  "nibabel>=5.3,<6",
  "pydicom>=3.0,<4",
  "scipy>=1.15,<2",
  "spectre-fm==0.2.1",
  "merlin-vlm==0.0.7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pc_recurrence"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "model: downloads and executes the real imaging model",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
